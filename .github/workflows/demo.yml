# Proves the action works end-to-end. Runs on push and on demand.
# Needs a repo secret: SLIDEFORGE_API_KEY  (free key: https://slideforge.dev/sign-up)
name: Demo — render a deck

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: deck
        uses: ./                       # this action, from the repo root
        with:
          api-key: ${{ secrets.SLIDEFORGE_API_KEY }}
          deck: examples/deck.json
          output: demo-deck.pptx

      - name: Show outputs
        run: |
          echo "job-id:   ${{ steps.deck.outputs.job-id }}"
          echo "status:   ${{ steps.deck.outputs.status }}"
          echo "fidelity: ${{ steps.deck.outputs.fidelity }}"
          echo "slides:   ${{ steps.deck.outputs.slides }}"
          echo "cost:     ${{ steps.deck.outputs.cost }}"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-deck
          path: ${{ steps.deck.outputs.pptx-path }}
